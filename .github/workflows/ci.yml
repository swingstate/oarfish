name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks before it builds anything.
  workflow_call:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test -race ./...
      # ADR 0009 E1, ORB-NFR-001: the resident size after Argon2id hashes on
      # Linux. Without the race detector, whose shadow memory would hide it.
      - name: Hash memory is returned to the OS (Linux, no race detector)
        working-directory: backend
        run: go test -count=1 -run '^TestHashMemoryIsReturnedToTheOS$' -v ./internal/auth
      # Short fuzz runs of the parsers that read untrusted system files.
      # The seed corpora also run as ordinary tests in the step above.
      - name: Fuzz the detection, metrics and password-hash parsers
        working-directory: backend
        run: |
          go test -run '^$' -fuzz '^FuzzParseOSRelease$' -fuzztime 5s ./internal/platform/operating_system
          go test -run '^$' -fuzz '^FuzzParseCompatible$' -fuzztime 5s ./internal/platform/hardware
          for f in FuzzParseStat FuzzParseMeminfo FuzzParseFibTrie FuzzParseInet6 FuzzParseMountinfo FuzzParseRoutes; do
            go test -run '^$' -fuzz "^${f}\$" -fuzztime 5s ./internal/metrics/parse
          done
          go test -run '^$' -fuzz '^FuzzParsePHC$' -fuzztime 5s ./internal/auth
      # ADR 0009 E1: golang.org/x/crypto/argon2 is the only third-party package
      # (TestArchitectureOnlyArgon2FromXCrypto checks the imports); here the
      # compiler's own view of the release target confirms it.
      - name: Only argon2 and its closure from golang.org/x in the linux/arm64 build
        working-directory: backend
        run: |
          deps="$(GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/oarfish | grep -v '^github.com/swingstate/oarfish/' || true)"
          echo "$deps"
          extra="$(echo "$deps" | grep -vxE 'golang.org/x/crypto/(argon2|blake2b)|golang.org/x/sys/cpu' || true)"
          if [ -n "$extra" ]; then echo "unexpected third-party packages: $extra"; exit 1; fi
          go mod verify
      # scripts/bundlegen is a separate stdlib-only module (release packaging).
      - name: Release tooling uses the same Go version
        run: diff <(grep '^go ' backend/go.mod) <(grep '^go ' scripts/bundlegen/go.mod)
      - name: Release tooling gofmt, vet and tests
        working-directory: scripts/bundlegen
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile)
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run check
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Build must not modify tracked embed files
        run: git diff --exit-code -- backend/internal/web
      - name: Hand over frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: backend/internal/web/dist
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: Release bundle, budgets and ARM64 smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: backend/internal/web/dist
      - name: Host build
        working-directory: backend
        run: go build -trimpath -o ../bin/oarfish ./cmd/oarfish
      # The same script builds the release bundle (CGO_ENABLED=0 GOOS=linux GOARCH=arm64).
      - name: Linux ARM64 release bundle
        run: scripts/release-bundle.sh -o dist/release
      - name: Verify ARM64 artifact
        run: |
          tar -xzf dist/release/oarfish_*_linux_arm64.tar.gz -C "$RUNNER_TEMP"
          bin="$(ls "$RUNNER_TEMP"/oarfish_*_linux_arm64/oarfish)"
          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit.*ARM aarch64'
      - name: Size budgets (ORB-NFR-005, ORB-NFR-006)
        run: scripts/check-budgets.sh dist/release/oarfish_*_linux_arm64.tar.gz
      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user
          qemu-aarch64 --version | head -1
      - name: ARM64 smoke test under emulation (ORB-CICD-004)
        run: |
          EXPECTED_VERSION="$(jq -r .version dist/release/manifest.json)" \
            scripts/smoke-test-arm64.sh dist/release/oarfish_*_linux_arm64.tar.gz

  reproducibility:
    name: Reproducible bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (lockfile)
        working-directory: frontend
        run: npm ci
      - name: Build the bundle twice from scratch and compare SHA-256
        run: scripts/check-reproducible.sh --rebuild-frontend

  signing:
    name: Signing and tamper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Install minisign (pinned version and SHA-256)
        run: scripts/install-minisign.sh
      # Throwaway keys generated inside the test. The release key is not involved.
      - name: Sign, verify and reject tampered input
        run: scripts/test-signing.sh

  installer:
    name: Installer checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Install minisign (pinned version and SHA-256)
        run: scripts/install-minisign.sh
      - name: shellcheck
        run: |
          shellcheck --version | head -2
          # The installer is POSIX sh and must be clean at every severity.
          shellcheck -s sh install/install.sh scripts/installer-container/run.sh scripts/installer-container/systemctl-stub.sh
          # The repository's bash scripts: warnings and errors.
          shellcheck -x -S warning scripts/*.sh
      - name: Installer embeds the committed release key
        run: scripts/check-installer-key.sh
      - name: Systemd unit passes systemd-analyze verify
        run: |
          # The unit refers to a binary and a user that do not exist on the runner; point it at /bin/true.
          sed 's#^ExecStart=.*#ExecStart=/bin/true#' install/oarfish.service > "$RUNNER_TEMP/oarfish.service"
          systemd-analyze --version | head -1
          systemd-analyze verify "$RUNNER_TEMP/oarfish.service"
          # Informational only: the unit is not changed to improve the score.
          set +e
          systemd-analyze security --offline=true --no-pager "$RUNNER_TEMP/oarfish.service" > "$RUNNER_TEMP/security.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/security.txt"
          echo "systemd-analyze security exit status: $status"
          {
            echo "### systemd-analyze security --offline=true (informational, ExecStart replaced by /bin/true)"
            echo '```'
            cat "$RUNNER_TEMP/security.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Installer tests against a fake root (dash, as on Debian and Ubuntu)
        run: |
          openssl version
          OARFISH_TEST_SH=/bin/dash scripts/test-installer.sh
      - name: Installer tests again with bash as /bin/sh
        run: OARFISH_TEST_SH=/bin/bash scripts/test-installer.sh

  # The installer and the real linux/arm64 binary in plain arm64 container images
  # under qemu-user. No systemd inside, so this is not a Raspberry Pi OS or Ubuntu
  # Server test; docs/INSTALL.md says what it does and does not cover.
  installer-containers:
    name: Installer in arm64 container (${{ matrix.image }})
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: backend/internal/web/dist
      - name: Install minisign (pinned version and SHA-256)
        run: scripts/install-minisign.sh
      - name: Register arm64 emulation for docker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user-static binfmt-support
      - name: Throwaway-signed release with the real arm64 binary
        run: |
          rel="$RUNNER_TEMP/release"
          scripts/release-bundle.sh -o "$rel"
          scripts/make-checksums.sh "$rel"
          scripts/sign-release.sh --ephemeral "$RUNNER_TEMP/throwaway.pub" "$rel"
          scripts/verify-release.sh "$rel" "$RUNNER_TEMP/throwaway.pub"
          scripts/make-test-installer.sh "$(jq -r .version "$rel/manifest.json")" "$RUNNER_TEMP/throwaway.pub" "$RUNNER_TEMP/test-install.sh"
      - name: Run the installer in the container
        run: scripts/test-installer-container.sh "${{ matrix.image }}" "$RUNNER_TEMP/release" "$RUNNER_TEMP/test-install.sh"

  # ORB-SEC-009 is SOLL. These checks run on every change; findings fail the job.
  security:
    name: Dependency scan and SBOM generation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - name: govulncheck (pinned)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: npm audit (high and critical fail the job)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: SBOM generation works
        run: scripts/make-sbom.sh "$RUNNER_TEMP/sbom"
